<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Assignment 0</title>
</head>
<body>
    <p style="color:crimson; margin: 10px; margin-top: 40px; padding: 10px; position: relative; text-align: center;">Here is nothing to see :).</p>
    <p style="color:crimson; margin-top: -3px; padding: 10px; position: relative; text-align: center;">But now that you're here, enjoy some pandas!</p>

    <section id="images">
        <div class="slideshow-container">

        <div class="mySlides fade">
            <img src="../images/panda1.jpeg" style="width:100%">
        </div>

        <div class="mySlides fade">
            <img src="../images/panda3.jpeg" style="width:100%">
        </div>
        <div>
        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>
        </div>
        </div>
        <br>

    </section>

    <style>
        body {
            background-color: rgb(250, 213, 230);
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
            max-width: device-width;
            font-size: big;
            text-decoration: none;
        }
        #images {
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            position: relative;
        }
        * {box-sizing:border-box}

        .slideshow-container {
        max-width: 400px;
        position: relative;
        margin: auto;
        }

        /* Hide the images by default */
        .mySlides {
        display: none;
        }

        /* Next & previous buttons */
        .prev, .next {
        cursor: pointer;
        position: absolute;
        top: 94%;
        width: auto;
        margin-top: 18px;
        padding: 20px;
        color: red;
        font-weight: bold;
        font-size: 18px;
        transition: 0.6s ease;
        border-radius: 0 3px 3px 0;
        user-select: none;
        left: 35%;
        }

        .next {
        right: 30px;
        border-radius: 2px 0 0  2px;
        }

        .fade {
        animation-name: fade;
        animation-duration: 1.5s;
        }

        @keyframes fade {
        from {opacity: .4}
        to {opacity: 1}
        }
    </style>
    <script src="assign0.js"></script>

</body>
</html>
